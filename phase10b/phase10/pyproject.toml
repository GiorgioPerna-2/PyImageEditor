[project]
name = "image-suite"
version = "0.1.0"
description = "A desktop image manipulation suite built with PyQt6"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7.0",
    "Pillow>=10.4.0",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "rembg>=2.0.50",
    "onnxruntime>=1.17.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "pyinstaller>=6.19.0",
    "nuitka[onefile]>=4.0.7",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
